# Publishes to npm when a GitHub release is published. The release tag must
# match package.json (e.g. tag v1.9.2 for "version": "1.9.2").
# Uses npm Trusted Publishing, so no npm token is stored in GitHub: on
# npmjs.com, package structocr → Settings → Trusted Publisher, choose GitHub
# Actions with owner dracula911, repository structocr-node and workflow
# publish.yml.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs npm test before publishing.
      - run: npm publish
